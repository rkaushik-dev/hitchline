plugins {
	id 'java'
	id 'application'
	id 'jacoco'
	id 'com.diffplug.spotless' version '7.0.4'
	id 'org.springframework.boot' version '3.5.16'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'io.github.rkaushikdev'
version = '1.0.0'
description = 'Adherence tracking for crews working rotational hitches'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'info.picocli:picocli:4.7.7'
	annotationProcessor 'info.picocli:picocli-codegen:4.7.7'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	// Exceptions here are never serialized, so serial lint is noise; annotation processors on
	// the classpath warn about annotations nobody claims.
	options.compilerArgs.addAll([
		'-Xlint:all,-serial,-processing',
		'-Werror'
	])
}

tasks.named('compileJava', JavaCompile) {
	options.compilerArgs << "-Aproject=${project.group}/${project.name}"
}

application {
	mainClass = 'io.github.rkaushikdev.hitchline.bin.Hitchline'
	applicationName = 'hitchline'
}

// The api process gets its own start script beside the command line's.
def serveStartScripts = tasks.register('serveStartScripts', CreateStartScripts) {
	mainClass = 'io.github.rkaushikdev.hitchline.bin.Serve'
	applicationName = 'hitchline-serve'
	outputDir = layout.buildDirectory.dir('serve-scripts').get().asFile
	classpath = tasks.named('startScripts', CreateStartScripts).get().classpath
}

distributions {
	main {
		contents {
			from(serveStartScripts) {
				into 'bin'
			}
		}
	}
}

springBoot {
	// The jar runs the command line; the api is started by its own entry point.
	mainClass = application.mainClass
}

tasks.named('jar', Jar) {
	manifest {
		attributes(
				'Implementation-Title': project.name,
				'Implementation-Version': project.version,
				'Implementation-Vendor': 'rkaushik-dev'
				)
	}
}

tasks.withType(Test).configureEach {
	maxParallelForks = 1
	// Mockito's agent appends to the boot class path when the web slices load it; without
	// class-data sharing the JVM has nothing to warn about.
	jvmArgs '-Xshare:off'
	systemProperty 'user.timezone', 'UTC'
	systemProperty 'user.language', 'en'
	systemProperty 'user.country', 'US'
	testLogging {
		events 'failed'
		exceptionFormat = 'full'
	}
}

tasks.named('test', Test) {
	useJUnitPlatform {
		excludeTags 'performance'
	}
	finalizedBy tasks.named('jacocoTestReport')
}

// Timing budgets for the hot paths, run on demand and kept out of check so a busy machine cannot fail the build.
tasks.register('performanceTest', Test) {
	description = 'Runs the tests tagged performance.'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'performance'
	}
}

jacoco {
	toolVersion = '0.8.13'
}

tasks.named('jacocoTestReport', JacocoReport) {
	dependsOn tasks.named('test')
	reports {
		xml.required = true
		html.required = true
	}
}

tasks.named('jacocoTestCoverageVerification', JacocoCoverageVerification) {
	dependsOn tasks.named('test')
	violationRules {
		rule {
			limit {
				counter = 'LINE'
				value = 'COVEREDRATIO'
				minimum = 0.80
			}
		}
	}
}

tasks.named('check') {
	dependsOn tasks.named('jacocoTestCoverageVerification')
}

spotless {
	java {
		target 'src/**/*.java'
		palantirJavaFormat()
		removeUnusedImports()
		trimTrailingWhitespace()
		endWithNewline()
	}
	groovyGradle {
		target '*.gradle'
		greclipse()
	}
}
